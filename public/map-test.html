<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>네이버 지도 인증 테스트</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #status {
      padding: 12px 16px;
      font-size: 14px;
      background: #f0f9ff;
      border-bottom: 1px solid #bae6fd;
      color: #0369a1;
    }
    #map { width: 100%; height: calc(100vh - 48px); }
  </style>
</head>
<body>
  <div id="status">⏳ 지도 로딩 중...</div>
  <div id="map"></div>

  <script>
    function initMap() {
      document.getElementById('status').textContent = '✅ 인증 성공! 지도가 정상 로드됨.';
      document.getElementById('status').style.background = '#f0fdf4';
      document.getElementById('status').style.borderColor = '#86efac';
      document.getElementById('status').style.color = '#166534';

      new naver.maps.Map('map', {
        center: new naver.maps.LatLng(37.3897, 126.9519),
        zoom: 15,
        zoomControl: true,
      });
    }
  </script>

  <!-- callback 파라미터로 스크립트 로드 완료 시점을 명확히 잡음 -->
  <script
    src="https://openapi.map.naver.com/openapi/v3/maps.js?ncpClientId=0rn8p66697&callback=initMap"
    onerror="
      document.getElementById('status').textContent = '❌ 스크립트 로드 자체가 실패함 (네트워크 오류)';
      document.getElementById('status').style.background = '#fef2f2';
      document.getElementById('status').style.color = '#991b1b';
    "
  ></script>
</body>
</html>
